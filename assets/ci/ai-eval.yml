# schematize-ai — o eval no CI REMOTO. Copie para .github/workflows/ do repo do PROJETO.
#
# Piso 27: o gate por commit é LOCAL (tools/ci.sh com o adaptador FALSO — barato, testa a tubulação).
# Este workflow roda o adaptador REAL, que gasta token: só sob demanda (workflow_dispatch) ou antes de
# promover ao hml (tag hml-* / v*). VETADO pull_request e push em branch aqui: cada PR/commit
# queimaria chamada de API (valide com scripts/check-ci-triggers.sh da engineering).
#
# Duas coisas que este arquivo assume e que voce precisa decidir:
#  1. QUAL adaptador roda aqui. O real mede o modelo; o falso so testa a TUBULACAO e o verde dele
#     nao diz nada sobre qualidade. Escolha com os olhos abertos.
#  2. Os scripts eval-run.mjs / eval-gate.mjs precisam estar NO REPO do projeto (vendor/ai-eval/),
#     copiados de schematize-ai/scripts/ — o runner do GitHub nao tem a skill instalada.
name: ai-eval

on:
  workflow_dispatch:
  push:
    tags: ['hml-*', 'v*']

concurrency:
  group: ai-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Scripts do eval vendorizados
        run: test -f vendor/ai-eval/eval-run.mjs -a -f vendor/ai-eval/eval-gate.mjs || { echo "::error::copie eval-run.mjs e eval-gate.mjs de schematize-ai/scripts/ para vendor/ai-eval/"; exit 1; }

      - name: A regua existe
        # Sem suite nao ha veredito. Ausencia de arquivo NAO e "passou".
        run: test -f eval/suite.json || { echo "::error::eval/suite.json ausente — sem eval, nao esta pronto."; exit 1; }

      - name: Rodar a suite
        env:
          # server-side, nunca no cliente. Sem a chave, use o adaptador falso E saiba o que isso mede.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node vendor/ai-eval/eval-run.mjs eval/suite.json \
            --adaptador ./eval/adaptador.mjs \
            --saida eval/run.json \
            --modelo "${EVAL_MODELO:?defina EVAL_MODELO (id do modelo, ver stack-versoes.md)}" \
            --quando "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Gate (trava a piora)
        run: |
          if [ -f eval/baseline.json ]; then
            node vendor/ai-eval/eval-gate.mjs eval/run.json --baseline eval/baseline.json
          else
            echo "::warning::sem eval/baseline.json — este run so checa o piso absoluto, nao regressao."
            node vendor/ai-eval/eval-gate.mjs eval/run.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval
          path: eval/run.json
